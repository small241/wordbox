<title>Wordbox</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{
  --bg:#EAF1FF;--surface:#FFFFFF;--ink:#16213E;--muted:#56628A;--line:#CDD9F4;
  --accent:#FF6A3D;--accent-ink:#FFFFFF;--teal:#0E9A9A;--sun:#FFC53D;--plum:#7A5AF8;--sky:#2F80ED;
  --ok:#1B8F4E;--ok-bg:#DDF6E8;--bad:#CC3B33;--bad-bg:#FFE4E1;--shadow:0 3px 0 rgba(22,33,62,.14);
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;--body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10162B;--surface:#1B2344;--ink:#EEF2FF;--muted:#A5B0D6;--line:#2E3969;
  --accent:#FF8257;--accent-ink:#1A1020;--teal:#3CCFCF;--sun:#FFD25E;--plum:#A18CFF;--sky:#6BA8FF;
  --ok:#4CD68F;--ok-bg:#153A2A;--bad:#FF837B;--bad-bg:#43201F;--shadow:0 3px 0 rgba(0,0,0,.35);}}
:root[data-theme="dark"]{
  --bg:#10162B;--surface:#1B2344;--ink:#EEF2FF;--muted:#A5B0D6;--line:#2E3969;
  --accent:#FF8257;--accent-ink:#1A1020;--teal:#3CCFCF;--sun:#FFD25E;--plum:#A18CFF;--sky:#6BA8FF;
  --ok:#4CD68F;--ok-bg:#153A2A;--bad:#FF837B;--bad-bg:#43201F;--shadow:0 3px 0 rgba(0,0,0,.35);}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4;padding-inline:16px;padding-block:14px 40px}
.wrap{max-width:640px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.logo{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.01em}
.logo b{color:var(--accent)}
.who{display:flex;gap:6px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:800;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hello{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.hello h2{font-size:30px}
.stats{display:flex;align-items:center;gap:14px}
.streak{font-family:var(--display);font-weight:700;font-size:22px;color:var(--accent);white-space:nowrap}
.ring{position:relative;width:64px;height:64px}
.ring svg{display:block}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:16px;font-variant-numeric:tabular-nums}
.ring-bg{stroke:var(--line)}.ring-fg{stroke:var(--teal)}
.lab{font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:13px 22px;font-weight:800;font-size:18px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.alt{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:var(--shadow)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45}
.cont{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--ink);color:var(--bg);border-radius:18px;padding:14px 16px;margin-bottom:12px}
.cont .lab{color:inherit;opacity:.7}.cont h3{font-size:22px}
.cont .btn{flex:none}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:22px}
.quick button{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 6px;font-weight:800;font-size:15px;box-shadow:var(--shadow)}
.quick small{display:block;color:var(--muted);font-weight:700;font-size:12px}
.sect{font-family:var(--display);font-size:20px;margin:22px 0 10px}
.unit{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px 14px 12px;margin-bottom:12px;box-shadow:var(--shadow)}
.unit.locked{opacity:.65;box-shadow:none}
.uh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.uh h3{font-size:20px}.uh small{color:var(--muted);font-weight:800;font-size:13px}
.lv{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.node{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:2px 0}
.nc{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px;background:var(--line);color:var(--muted);border:3px solid transparent}
.node.cur .nc{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
.node.done .nc{background:var(--teal);color:#fff;font-size:15px;letter-spacing:-.05em}
.node.open .nc{background:var(--surface);color:var(--ink);border-color:var(--line)}
.node.lock{cursor:default}
.nl{font-size:11px;font-weight:800;color:var(--muted);text-align:center;line-height:1.1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px;text-align:left;box-shadow:var(--shadow);font-weight:800}
.tile small{display:block;color:var(--muted);font-weight:700;font-size:13px}
.note{background:var(--surface);border:2px dashed var(--line);border-radius:14px;padding:10px 14px;color:var(--muted);font-size:14px;font-weight:700;margin-top:14px}
.link{background:none;border:0;color:var(--sky);font-weight:800;text-decoration:underline;padding:6px 0;margin-top:10px}
.sess-top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px}
.sess-top .bar{flex:1;margin:0}
.bar i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .4s}
.x{border:2px solid var(--line);background:var(--surface);border-radius:12px;width:42px;height:42px;font-size:20px;font-weight:800}
.card{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:22px 18px;box-shadow:var(--shadow)}
.big{font-family:var(--display);font-size:clamp(32px,9vw,50px);font-weight:600;line-height:1.1;margin:6px 0 4px;overflow-wrap:anywhere}
.bigrow{display:flex;align-items:center;gap:12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
@media(max-width:420px){.opts{grid-template-columns:1fr}}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 10px;font-weight:800;font-size:18px;box-shadow:var(--shadow);min-height:58px;overflow-wrap:anywhere}
.opt.ok,.pair.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.opt.bad,.pair.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.oc{display:flex;gap:6px;align-items:stretch}.oc .opt,.oc .pair{flex:1;min-width:0}
.sp{flex:none;display:inline-grid;place-items:center;width:46px;min-height:46px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--sky);box-shadow:var(--shadow);padding:0}
.sp:active{transform:translateY(2px);box-shadow:none}
.sp.sm{width:36px;min-height:36px;border-radius:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
input[type=text],textarea,select{width:100%;font:inherit;font-weight:700;font-size:20px;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
textarea{font-size:16px;min-height:140px}
select{width:auto;font-size:16px;padding:8px 10px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.fb{margin-top:16px;border-radius:14px;padding:12px 14px;font-weight:800}
.fb.ok{background:var(--ok-bg);color:var(--ok)}.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb span{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--display);font-size:24px;color:var(--ink)}
.mic{width:96px;height:96px;border-radius:50%;border:0;background:var(--plum);color:#fff;display:grid;place-items:center;box-shadow:0 5px 0 rgba(0,0,0,.2);margin:16px auto 6px}
.mic.on{background:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
@media(prefers-reduced-motion:reduce){.mic.on{animation:none}.bar i{transition:none}}
.heard{text-align:center;color:var(--muted);font-weight:800;min-height:26px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cols .col{display:flex;flex-direction:column;gap:10px}
.pair{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 8px;font-weight:800;font-size:17px;box-shadow:var(--shadow);min-height:58px;overflow-wrap:anywhere}
.pair.sel{border-color:var(--sky);background:var(--bg);color:var(--sky)}
.pair.done{visibility:hidden}
.pair.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pic{text-align:center;font-size:96px;line-height:1.1;margin:10px 0 4px}.pv{max-width:100%;height:auto}
.bignum{font-family:var(--display);font-weight:700;font-size:84px;color:var(--teal)}
.pv-t{fill:var(--muted)}.pv-b{fill:var(--line);stroke:var(--sky);stroke-width:3}.pv-f{fill:var(--sky)}.pv-l{stroke:var(--muted);stroke-width:3}
.sen{font-family:var(--display);font-size:clamp(24px,6.5vw,32px);line-height:1.25;margin:8px 0}
.blank{display:inline-block;min-width:3.2em;border-bottom:4px solid var(--sky);margin:0 4px;color:transparent}
.blank.ok{color:var(--ok);border-color:var(--ok)}.blank.bad{color:var(--bad);border-color:var(--bad)}
.hintline{color:var(--muted);font-weight:700;font-size:16px;margin-top:2px}
.line{display:flex;flex-wrap:wrap;gap:8px;min-height:64px;padding:10px 0;border-top:2px solid var(--line);border-bottom:2px solid var(--line);margin:16px 0 14px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tl{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:800;font-size:18px;box-shadow:var(--shadow)}
.tl.used{visibility:hidden}
.line .tl{border-color:var(--sky)}
.line.ok .tl{border-color:var(--ok);color:var(--ok)}.line.bad .tl{border-color:var(--bad);color:var(--bad)}
.stars{font-family:var(--display);font-size:64px;color:var(--sun);letter-spacing:.1em;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.res{text-align:center}.res .big{margin-block:2px 10px}
.hint{color:var(--muted);font-size:14px;font-weight:700;margin:4px 0 10px}
.nw{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.nw:last-of-type{border-bottom:0}.nwp{width:64px;text-align:center;font-size:36px;line-height:1}.nwp .pv{width:60px}.nwp .bignum{font-size:32px}
.nwt{flex:1;font-size:19px;min-width:0;overflow-wrap:anywhere}.nwt small{color:var(--muted);font-weight:700;font-size:15px}
.wl{max-height:260px;overflow:auto;border:2px solid var(--line);border-radius:14px;background:var(--surface)}
.wl div{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-weight:700}
.wl div:last-child{border-bottom:0}.wl small{color:var(--muted)}
.wl button[data-act="del"]{border:0;background:none;color:var(--bad);font-weight:800;font-size:18px;padding:0 6px}
.sec{margin-top:22px}.sec h3{font-size:21px;margin-bottom:8px}
label{font-weight:800;font-size:15px}
.chk{display:flex;align-items:center;gap:10px;padding:6px 0}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px}
.wrongs{margin-top:14px;text-align:left}
.tabs{display:flex;gap:6px;background:var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;border-radius:11px;padding:9px;font-weight:800;font-size:16px}
.tabs button[aria-selected="true"]{background:var(--surface);box-shadow:var(--shadow)}
.pathcol{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 0 4px;overflow:hidden}
.pn{display:flex;justify-content:center}
.node.fin .nc{width:64px;height:64px;font-size:26px}
.node.fin{padding:0}
</style>

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function norm(s){return String(s).toLowerCase().replace(/ł/g,'l').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim()}
function compact(s){return norm(s).replace(/ /g,'')}
function answers(s){return s.split(/[\/,]/).map(compact).filter(Boolean)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

  return header()+'<h2 style="margin-bottom:6px">Ustawienia</h2>'+(msg?'<div class="fb ok">'+esc(msg)+'</div>':'')+
  '<div class="sec"><h3>Imiona</h3>'+D.profiles.map(function(p,i){return'<div style="margin-bottom:8px"><input type="text" id="nm'+i+'" data-name="'+i+'" value="'+esc(p.name)+'" aria-label="Imię '+(i+1)+'" maxlength="16"></div>'}).join('')+'</div>'+
  '<div class="sec"><h3>Dzienny cel</h3><div class="seg">'+[10,20,30,50].map(function(n){return'<label><input type="radio" name="goal" data-act="goal" data-n="'+n+'"'+((D.goal||20)===n?' checked':'')+'> '+n+' zadań</label>'}).join('')+'</div></div>'+
  '<div class="sec"><h3>Mikrofon</h3><div class="chk"><input type="checkbox" id="micck" data-act="micon"'+(D.micOff?'':' checked')+'><label for="micck">Próbuj rozpoznawania mowy w aplikacji</label></div><div class="hint">Gdy przeglądarka blokuje mikrofon, zadania „Mów” działają przez dyktowanie z klawiatury.</div></div>'+
  '<div class="sec"><h3>Ścieżka</h3><div class="chk"><input type="checkbox" id="exck" data-act="extras"'+(D.extras!==false?' checked':'')+'><label for="exck">Pokazuj dodatkowe sekcje spoza zeszytu (dom, jedzenie, liczby do 100...)</label></div><div class="row"><button class="btn alt" data-act="openall">Odblokuj wszystkie sekcje</button></div></div>'+
  '<div class="sec"><h3>Dodaj słówka</h3><div class="hint">Jedno w linii: <b>apple - jabłko</b>. Wiersz <b>Lekcja 7</b> albo <b>Zeszły rok - Lekcja 3</b> przypisuje kolejne słówka do tej lekcji. Ścieżka sama podzieli słówka na sekcje.</div>'+
  '<textarea id="imp" placeholder="Lekcja 7&#10;apple - jabłko&#10;dog - pies" aria-label="Lista słówek"></textarea>'+
  '<div class="row" style="margin-top:8px"><label for="impl">Bez nagłówka dodaj do:</label><input type="text" id="impl" style="width:120px" placeholder="np. 7 lub Z3" aria-label="Lekcja"></div>'+
  '<div class="chk"><input type="checkbox" id="swap"><label for="swap">Polskie słowo jest pierwsze</label></div>'+
  '<div class="row"><button class="btn" data-act="add">Dodaj</button></div></div>'+
  '<div class="sec"><h3>Moje dodane słówka ('+D.custom.length+')</h3><div class="wl">'+D.custom.map(function(w,i){return'<div><span>'+esc(w.en)+' <small>'+esc(w.pl)+' · '+esc(w.l)+'</small></span><span style="display:flex;gap:6px;align-items:center">'+sp(w.en,'sm')+'<button data-act="del" data-i="'+i+'" aria-label="Usuń '+esc(w.en)+'">×</button></span></div>'}).join('')+'</div></div>'+
  '<div class="sec"><h3>Postępy</h3><button class="btn alt" data-act="reset">'+(confirmReset?'Na pewno? Kliknij jeszcze raz':'Wyzeruj postępy: '+esc(P().name))+'</button></div>'+
  '<div class="row"><button class="btn" data-act="home">Gotowe</button></div><div class="note">Postępy zapisują się w przeglądarce, na tym urządzeniu. Na telefonie i komputerze są osobne.</div>'}
function render(){var app=document.getElementById('app');
  app.innerHTML=view==='play'?play():view==='result'?result():view==='settings'?settings():view==='test'?testView():home();
  var a=document.getElementById('ans');if(a&&!a.disabled)a.focus();else{var n=document.getElementById('nx');if(n&&view==='play')n.focus()}
  window.scrollTo(0,0)}

/* ---------- events ---------- */
document.addEventListener('input',function(e){var i=e.target.getAttribute&&e.target.getAttribute('data-name');if(i!==null&&i!==undefined){D.profiles[+i].name=e.target.value||'Syn '+(+i+1);save()}});
document.addEventListener('keydown',function(e){if(e.key!=='Enter'||view!=='play'||!S)return;
  if(e.target.id==='ans'&&S.phase==='ask'){e.preventDefault();checkWrite()}else if(S.phase==='fb'&&e.target.tagName!=='BUTTON')next()});
document.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act,q=S&&S.qs?S.qs[S.i]:null;
  if(a==='who'){D.active=+b.dataset.i;save();if(view==='play'||view==='result')view='home';render()}
  else if(a==='home'){view='home';msg='';S=null;render()}
  else if(a==='tab'){D.tab=b.dataset.t;save();view='home';render()}
  else if(a==='settings'){view='settings';msg='';confirmReset=false;render()}
  else if(a==='say'){speak(b.dataset.t)}
  else if(a==='lesson'){startLesson(b.dataset.k,+b.dataset.j)}
  else if(a==='opensec'){P().open[b.dataset.k]=1;save();render()}
  else if(a==='openall'){SEC.forEach(function(s){P().open[s.key]=1});save();msg='Wszystkie sekcje są odblokowane.';render()}
  else if(a==='review'){startReview()}
  else if(a==='free'){startFree(b.dataset.t)}
  else if(a==='testsetup'){setup=setup||{units:{},n:15,types:['mc','pic','write','listen','fill','build']};setup.err='';view='test';render()}
  else if(a==='tu'){setup.units[b.dataset.k]=b.checked}
  else if(a==='tall'){U.forEach(function(u){if(unitAvail(u))setup.units[u.k]=b.dataset.v==='1'});render()}
  else if(a==='tn'){setup.n=+b.dataset.n}
  else if(a==='tt'){var t=b.dataset.t,ix=setup.types.indexOf(t);if(b.checked&&ix<0)setup.types.push(t);if(!b.checked&&ix>-1)setup.types.splice(ix,1);if(!setup.types.length){setup.types=['mc'];render()}}
  else if(a==='starttest'){startTest()}
  else if(a==='pracwrong'){var seen={},ws=[];S.log.forEach(function(x){if(!x.ok&&x.w&&!seen[x.w.en]){seen[x.w.en]=1;ws.push(x.w)}});if(ws.length)startPractice(ws)}
  else if(a==='mc'){q.chosen=q.opts[+b.dataset.k];done(q.chosen.en===q.w.en,q.w,{say:q.w.en})}
  else if(a==='fillo'){q.chosen=q.opts[+b.dataset.k];done(q.chosen===q.target,q.tw,{say:clean(q.s.en)})}
  else if(a==='check'){checkWrite()}
  else if(a==='next'){next()}
  else if(a==='mic'){listenMic()}
  else if(a==='skip'){done(false,q.w)}
  else if(a==='tile'){var id=+b.dataset.id,ix2=q.sel.indexOf(id);if(ix2>-1)q.sel.splice(ix2,1);else q.sel.push(id);render()}
  else if(a==='checkb'){checkBuild()}
  else if(a==='pair'){var w=q.ws.filter(function(x){return x.en===b.dataset.w})[0],side=b.dataset.s;q.bad={};
    if(!q.sel||q.sel.side===side){q.sel={w:w,side:side};render();return}
    var f=q.sel;q.sel=null;
    if(f.w.en===w.en){q.done[w.en]=1;if(Object.keys(q.done).length===q.ws.length){q.ws.forEach(function(x){bump(x,!q.first[x.en])});var ok=q.mist<=1;credit(ok,null,false);S.ok=ok;if(S.kind==='test'){S.log.push({ok:ok,w:q.ws[0],q:q});return next()}S.phase='fb'}render()}
    else{q.first[f.w.en]=1;q.first[w.en]=1;q.mist++;q.bad[f.w.en+f.side]=1;q.bad[w.en+side]=1;render()}}
  else if(a==='micon'){D.micOff=!b.checked;save()}
  else if(a==='goal'){D.goal=+b.dataset.n;save()}
  else if(a==='extras'){D.extras=b.checked;save();buildUnits()}
  else if(a==='add'){var r=parseImport(document.getElementById('imp').value,document.getElementById('swap').checked,(document.getElementById('impl').value||'M').trim().toUpperCase());
    if(!r.out.length){msg='Nie znalazłem żadnych par. Sprawdź, czy słowa są rozdzielone myślnikiem.';render();return}
    r.out.forEach(function(w){if(!D.custom.some(function(x){return x.en.toLowerCase()===w.en.toLowerCase()&&x.l===w.l}))D.custom.push(w)});
    save();buildUnits();msg='Dodano '+r.out.length+' słówek'+(r.bad?' ('+r.bad+' linii pominięto)':'')+'.';render()}
  else if(a==='del'){D.custom.splice(+b.dataset.i,1);save();buildUnits();render()}
  else if(a==='reset'){if(!confirmReset){confirmReset=true;render();return}var p=P();p.stats={};p.xp=0;p.sec={};p.open={};p.last=null;p.days={};confirmReset=false;save();msg='Postępy wyzerowane.';render()}});
if(SPK)try{speechSynthesis.getVoices()}catch(e){}
render();
})();
</script>
